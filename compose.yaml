services:
  web:
    build: .
    image: genaisis-activities:local
    restart: unless-stopped
    environment:
      URL_PREFIX: "${URL_PREFIX:-/genaisis}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      GOOGLE_SITE_VERIFICATION: "${GOOGLE_SITE_VERIFICATION:-}"
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:8000"
    volumes:
      - responses:/var/lib/genaisis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  responses:
