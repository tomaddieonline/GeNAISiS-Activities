# Docker Standalone stack: paste into Portainer's stack editor.
# The migration branch has its own image tag; main publishes latest.
# IMAGE_TAG can also select sha-<full Git commit hash> from a successful build.
services:
  web:
    image: ghcr.io/tomaddieonline/genaisis-activities:${IMAGE_TAG:-migration-to-new-site}
    restart: unless-stopped
    environment:
      URL_PREFIX: "${URL_PREFIX:-/genaisis}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://pantheon.greek-geek.info}"
      GOOGLE_SITE_VERIFICATION: "${GOOGLE_SITE_VERIFICATION:-}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8083}:8000"
    volumes:
      - responses:/var/lib/genaisis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  responses:
