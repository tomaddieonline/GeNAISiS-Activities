# Add these locations inside the existing HTTPS server block for
# pantheon.greek-geek.info on 192.168.1.22.
# The Docker stack publishes 127.0.0.1:8083 and sets URL_PREFIX=/genaisis.

location = /genaisis {
    return 308 /genaisis/;
}

location /genaisis/ {
    # Preserve /genaisis in the upstream request (no trailing slash here).
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
